<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务会计（中级）答题练习</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#1a2332;line-height:1.65;min-height:100vh;
  background:radial-gradient(ellipse 80% 50% at 10% -10%,#c8e8e4 0%,transparent 55%),
             radial-gradient(ellipse 60% 40% at 100% 0%,#d4e4f0 0%,transparent 50%),#f0f4f8;
  -webkit-text-size-adjust:100%;
}
.app{max-width:920px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:clamp(1.5rem,3.5vw,2.1rem);font-weight:700;color:#0d6e6e;letter-spacing:-.02em}
.sub{color:#5a6a7a;margin:6px 0 18px;font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select,button{font-family:inherit;font-size:16px}
select{
  flex:1;min-width:180px;padding:12px 14px;border:1px solid #d8e0e8;border-radius:10px;
  background:#fff;color:#1a2332;
}
.btn{
  padding:12px 16px;border:none;border-radius:10px;cursor:pointer;font-weight:600;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary{background:#0d6e6e;color:#fff}
.btn-primary:hover{background:#0a5a5a}
.btn-ghost{background:#fff;color:#1a2332;border:1px solid #d8e0e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  padding:8px 12px;border-radius:99px;border:1px solid #d8e0e8;background:#fff;
  font-size:.85rem;font-weight:600;color:#5a6a7a;cursor:pointer;
}
.chip.active{background:#0d6e6e;color:#fff;border-color:#0d6e6e}
.progress-bar{height:6px;background:#d8e0e8;border-radius:99px;overflow:hidden;margin-bottom:8px}
.progress-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0d6e6e,#2a9d8f);transition:width .3s}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:#5a6a7a;margin-bottom:18px}
.stats strong{color:#1a2332}
.card{
  background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(26,35,50,.08);
  padding:26px 22px;border:1px solid rgba(216,224,232,.6);
}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tag{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:6px;background:#e6f3f3;color:#0d6e6e}
.tag.calc{background:#fff3e0;color:#c06a00}
.tag.judge{background:#ede7f6;color:#5e35b1}
.tag.multi{background:#e3f2fd;color:#1565c0}
.stem{font-size:1.05rem;font-weight:500;white-space:pre-wrap;margin-bottom:18px;word-break:break-word}
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  border:1.5px solid #d8e0e8;border-radius:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:#0d6e6e;background:#f7fbfb}
.opt.selected{border-color:#0d6e6e;background:#e6f3f3}
.opt.correct-mark{border-color:#1b7a3d;background:#e8f7ed}
.opt.wrong-mark{border-color:#c0392b;background:#fdecea}
.opt input{margin-top:3px;accent-color:#0d6e6e;width:18px;height:18px;flex-shrink:0}
.opt .oid{font-weight:700;color:#0d6e6e;min-width:1.2em}
.opt .otxt{flex:1;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.result-box{margin-top:20px;padding:16px 18px;border-radius:12px;display:none}
.result-box.show{display:block}
.result-box.ok{background:#e8f7ed;border:1px solid #a8d5b5}
.result-box.bad{background:#fdecea;border:1px solid #f0b4ae}
.result-box.calc-reveal{background:#f7f9fc;border:1px solid #d8e0e8}
.result-title{font-weight:700;font-size:1.05rem;margin-bottom:8px}
.result-box.ok .result-title{color:#1b7a3d}
.result-box.bad .result-title{color:#c0392b}
.explanation{font-size:.94rem;white-space:pre-wrap;word-break:break-word}
.explanation pre{
  background:#1a2332;color:#e8eef4;padding:12px 14px;border-radius:8px;
  overflow-x:auto;font-size:.85rem;margin:8px 0;white-space:pre-wrap;
}
.explanation table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.88rem}
.explanation th,.explanation td{border:1px solid #d8e0e8;padding:6px 10px;text-align:left}
.explanation th{background:#f0f4f8}
.explanation blockquote{border-left:3px solid #0d6e6e;padding-left:12px;color:#5a6a7a;margin:8px 0}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.summary{display:none}
.summary.show{display:block}
.score-big{font-size:2.4rem;font-weight:700;color:#0d6e6e}
.empty{text-align:center;padding:40px;color:#5a6a7a}
.err{display:none;background:#fdecea;border:1px solid #f0b4ae;color:#8a1f16;padding:14px;border-radius:10px;margin-bottom:16px;white-space:pre-wrap}
.tip{font-size:.88rem;color:#5a6a7a;background:#fff;border:1px solid #d8e0e8;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.ui-hidden{display:none!important}
@media(max-width:560px){.card{padding:18px 16px}.app{padding:18px 12px 60px}}
</style>
</head>
<body>
<div class="app">
  <h1>财务会计（中级）答题练习</h1>
  <p class="sub">打开页面时自动读取仓库中的 <code>questions.md</code> 生成题目</p>
  <p class="tip">更新题目：修改仓库里的 <b>questions.md</b> 并提交后，刷新本页即可（可能需强制刷新）。</p>
  <div class="err" id="errBox"></div>

  <div id="mainUi" class="ui-hidden">
    <div class="toolbar">
      <select id="chapterSelect" aria-label="章节"></select>
      <button class="btn btn-ghost" id="btnReload" type="button">重新加载 MD</button>
      <button class="btn btn-ghost" id="btnReset" type="button">重置本章</button>
      <button class="btn btn-ghost" id="btnSummary" type="button">查看成绩</button>
    </div>
    <div class="filter-row" id="typeFilter">
      <button class="chip active" data-type="all" type="button">全部</button>
      <button class="chip" data-type="single" type="button">单选</button>
      <button class="chip" data-type="multi" type="button">多选</button>
      <button class="chip" data-type="judge" type="button">判断</button>
      <button class="chip" data-type="calc" type="button">计算分析</button>
    </div>
    <div class="progress-bar"><i id="progFill"></i></div>
    <div class="stats">
      <span>进度 <strong id="statProg">0/0</strong></span>
      <span>正确 <strong id="statOk" style="color:#1b7a3d">0</strong></span>
      <span>错误 <strong id="statBad" style="color:#c0392b">0</strong></span>
    </div>
    <div id="quizArea" class="card"><div class="empty">正在从 questions.md 加载…</div></div>
    <div id="summaryArea" class="card summary"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MD_URLS = [
    "./questions.md",
    "questions.md",
    "https://raw.githubusercontent.com/haoyi01/facct-quiz/main/questions.md"
  ];

  var TYPE_LABEL = {
    single: "单项选择题",
    multi: "多项选择题",
    judge: "判断题",
    calc: "计算分析题"
  };

  var CHAPTERS = [];
  var chapIdx = 0;
  var qIdx = 0;
  var typeFilter = "all";
  var mem = {};
  var progress = loadP();

  function showErr(m) {
    var b = document.getElementById("errBox");
    b.style.display = "block";
    b.textContent = m;
  }
  function clearErr() {
    var b = document.getElementById("errBox");
    b.style.display = "none";
    b.textContent = "";
  }

  function loadP() {
    try {
      var s = localStorage.getItem("facct_quiz_md_v1");
      if (s) return JSON.parse(s);
    } catch (e) {}
    return mem;
  }
  function saveP(p) {
    mem = p;
    try {
      localStorage.setItem("facct_quiz_md_v1", JSON.stringify(p));
    } catch (e) {}
  }

  /** Parse quiz markdown → chapters[] */
  function parseMarkdown(text) {
    var chaptersRaw = text.split(/\n## /);
    var chapters = [];
    for (var bi = 0; bi < chaptersRaw.length; bi++) {
      var block = chaptersRaw[bi];
      if (!block.trim()) continue;
      var firstLine = block.split("\n")[0].trim();
      if (firstLine.indexOf("13140") === 0 || firstLine.charAt(0) === "#") continue;
      if (firstLine.indexOf("附") >= 0 && firstLine.indexOf("录") >= 0) continue;
      if (firstLine.indexOf("第") !== 0) continue;

      var title = firstLine.trim();
      var ansM = block.match(/### 【.+?答案与解析】/);
      if (!ansM) continue;
      var ansIdx = block.indexOf(ansM[0]);
      var qPart = block.slice(0, ansIdx);
      var aPart = block.slice(ansIdx + ansM[0].length);
      var answers = {};

      var re1 = /\*\*(\d+)\.\s*([A-E√×]+)\*\*\s*([\s\S]*?)(?=\n\*\*\d+\.|\n---|\n\*\*\d+\.【|$)/g;
      var m;
      while ((m = re1.exec(aPart))) {
        answers[+m[1]] = {
          key: m[2].trim(),
          explanation: m[3].trim().replace(/\n---+\s*$/, "").trim()
        };
      }
      var re2 = /\*\*(\d+)\.【计算分析题答案】\*\*\s*([\s\S]*?)(?=\n\*\*\d+\.|\n---+\s*\n## |\n---+\s*$|$)/g;
      while ((m = re2.exec(aPart))) {
        answers[+m[1]] = {
          key: null,
          explanation: m[2].trim().replace(/\n---+\s*$/, "").trim(),
          calc: true
        };
      }

      var questions = [];
      var sections = qPart.split(/\n### /);
      for (var si = 1; si < sections.length; si++) {
        var sec = sections[si];
        var secTitle = sec.split("\n")[0].trim();
        var body = sec.indexOf("\n") >= 0 ? sec.slice(sec.indexOf("\n") + 1) : "";
        var currentType = null;
        if (secTitle.indexOf("单项选择") >= 0) currentType = "single";
        else if (secTitle.indexOf("多项选择") >= 0) currentType = "multi";
        else if (secTitle.indexOf("判断") >= 0) currentType = "judge";
        else if (secTitle.indexOf("计算") >= 0) currentType = "calc";
        else continue;

        var qBlocks = ("\n" + body).split(/\n(?=\*\*\d+\.\*\*)/);
        for (var qi = 0; qi < qBlocks.length; qi++) {
          var qb = qBlocks[qi].trim();
          if (!qb) continue;
          var hm = qb.match(/^\*\*(\d+)\.\*\*\s*([\s\S]+)/);
          if (!hm) continue;
          var num = +hm[1];
          var rest = hm[2].trim();
          var starsM = rest.match(/^(⭐+)\s*/);
          var stars = starsM ? starsM[1] : "";
          if (starsM) rest = rest.slice(starsM[0].length);

          var options = [];
          var stem = rest;
          if (currentType === "single" || currentType === "multi") {
            var firstOpt = rest.search(/(?:^|\n)\s*[A-E]\.\s*/);
            if (firstOpt >= 0) {
              stem = rest.slice(0, firstOpt).trim();
              var optText = rest.slice(firstOpt).trim();
              var markers = [];
              var ore = /([A-E])\.\s*/g;
              var om;
              while ((om = ore.exec(optText))) {
                if (om.index === 0 || /[\s\u3000]/.test(optText.charAt(om.index - 1))) {
                  markers.push({
                    id: om[1],
                    start: om.index + om[0].length,
                    markAt: om.index
                  });
                }
              }
              for (var mi = 0; mi < markers.length; mi++) {
                var end = mi + 1 < markers.length ? markers[mi + 1].markAt : optText.length;
                options.push({
                  id: markers[mi].id,
                  text: optText.slice(markers[mi].start, end).trim().replace(/\s+/g, " ")
                });
              }
            }
          } else if (currentType === "judge") {
            stem = stem.replace(/[（(]\s*[）)]\s*$/, "").trim();
            options = [
              { id: "√", text: "正确" },
              { id: "×", text: "错误" }
            ];
          }

          var ans = answers[num] || {};
          var key = ans.key;
          if (currentType === "judge" && key) {
            if (["√", "对", "正确"].indexOf(key) >= 0) key = "√";
            else if (["×", "错", "错误"].indexOf(key) >= 0) key = "×";
          }
          var correct = [];
          if (currentType === "multi" && key) correct = key.split("");
          else if (key) correct = [key];

          questions.push({
            id: title + "-" + num,
            num: num,
            type: currentType,
            stars: stars,
            stem: stem.trim(),
            options: options,
            correct: correct,
            explanation: ans.explanation || "暂无解析"
          });
        }
      }
      chapters.push({ title: title, questions: questions });
    }
    return chapters;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function mdLite(s) {
    if (!s) return "";
    var t = esc(s);
    t = t.replace(/```([\s\S]*?)```/g, function (_, c) {
      return "<pre>" + c.trim() + "</pre>";
    });
    t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/^&gt;\s*(.+)$/gm, "<blockquote>$1</blockquote>");
    return t;
  }
  function eq(a, b) {
    return (
      a
        .slice()
        .map(String)
        .sort()
        .join(",") ===
      b
        .slice()
        .map(String)
        .sort()
        .join(",")
    );
  }
  function filtered() {
    var qs = CHAPTERS[chapIdx].questions;
    if (typeFilter === "all") return qs;
    var o = [];
    for (var i = 0; i < qs.length; i++) if (qs[i].type === typeFilter) o.push(qs[i]);
    return o;
  }
  function updateStats() {
    var qs = filtered(),
      done = 0,
      ok = 0,
      bad = 0;
    for (var i = 0; i < qs.length; i++) {
      var p = progress[qs[i].id];
      if (p && p.answered) {
        done++;
        if (p.correct) ok++;
        else bad++;
      }
    }
    document.getElementById("statProg").textContent = done + "/" + qs.length;
    document.getElementById("statOk").textContent = String(ok);
    document.getElementById("statBad").textContent = String(bad);
    document.getElementById("progFill").style.width =
      (qs.length ? (done / qs.length) * 100 : 0) + "%";
  }

  function bindUi() {
    var sel = document.getElementById("chapterSelect");
    sel.innerHTML = CHAPTERS.map(function (c, i) {
      return (
        '<option value="' +
        i +
        '">' +
        c.title +
        "（" +
        c.questions.length +
        "题）</option>"
      );
    }).join("");
    sel.onchange = function () {
      chapIdx = +sel.value;
      qIdx = 0;
      render();
    };

    document.getElementById("typeFilter").onclick = function (e) {
      var t = e.target;
      if (!t || t.tagName !== "BUTTON" || !t.getAttribute("data-type")) return;
      var chips = document.getElementById("typeFilter").getElementsByTagName("button");
      for (var i = 0; i < chips.length; i++) chips[i].className = "chip";
      t.className = "chip active";
      typeFilter = t.getAttribute("data-type");
      qIdx = 0;
      render();
    };
    document.getElementById("btnReset").onclick = function () {
      var qs = CHAPTERS[chapIdx].questions;
      for (var i = 0; i < qs.length; i++) delete progress[qs[i].id];
      saveP(progress);
      qIdx = 0;
      render();
    };
    document.getElementById("btnSummary").onclick = function () {
      showSummary();
    };
    document.getElementById("btnReload").onclick = function () {
      loadQuiz(true);
    };
  }

  function render() {
    document.getElementById("summaryArea").className = "card summary";
    var area = document.getElementById("quizArea");
    area.style.display = "block";
    var qs = filtered();
    updateStats();
    if (!qs.length) {
      area.innerHTML = '<div class="empty">当前筛选下暂无题目</div>';
      return;
    }
    if (qIdx >= qs.length) qIdx = qs.length - 1;
    if (qIdx < 0) qIdx = 0;
    var q = qs[qIdx],
      saved = progress[q.id],
      answered = !!(saved && saved.answered),
      selected = {};
    if (saved && saved.selected)
      for (var i = 0; i < saved.selected.length; i++) selected[saved.selected[i]] = true;

    var optsHtml = "";
    if (q.type === "calc") {
      optsHtml =
        '<p style="color:#5a6a7a;font-size:.92rem;margin-bottom:8px;">请先独立思考作答，再点击「查看解析」对照答案。</p>';
    } else {
      var inputType = q.type === "multi" ? "checkbox" : "radio";
      optsHtml = '<div class="options">';
      for (var oi = 0; oi < q.options.length; oi++) {
        var o = q.options[oi],
          isSel = !!selected[o.id],
          cls = "opt" + (isSel ? " selected" : "");
        if (answered) {
          if (q.correct.indexOf(o.id) >= 0) cls += " correct-mark";
          else if (isSel) cls += " wrong-mark";
        }
        optsHtml +=
          '<label class="' +
          cls +
          '"><input type="' +
          inputType +
          '" name="ans" value="' +
          o.id +
          '"' +
          (isSel ? " checked" : "") +
          (answered ? " disabled" : "") +
          ">" +
          '<span class="oid">' +
          o.id +
          '.</span><span class="otxt">' +
          esc(o.text) +
          "</span></label>";
      }
      optsHtml += "</div>";
    }

    var resultHtml = "";
    if (answered) {
      if (q.type === "calc") {
        resultHtml =
          '<div class="result-box calc-reveal show"><div class="result-title">参考答案与解析</div><div class="explanation">' +
          mdLite(q.explanation) +
          "</div></div>";
      } else {
        var ok = saved.correct,
          yourAns =
            saved.selected && saved.selected.length
              ? saved.selected.join("")
              : "（未选）",
          rightAns = q.correct.join("");
        resultHtml =
          '<div class="result-box ' +
          (ok ? "ok" : "bad") +
          ' show"><div class="result-title">' +
          (ok ? "✓ 回答正确" : "✗ 回答错误") +
          "</div>" +
          '<p style="margin-bottom:10px;font-size:.92rem;">你的答案：<strong>' +
          esc(yourAns) +
          "</strong>　正确答案：<strong>" +
          esc(rightAns) +
          "</strong></p>" +
          '<div class="explanation">' +
          mdLite(q.explanation) +
          "</div></div>";
      }
    }

    var submitLabel =
      q.type === "calc"
        ? answered
          ? "已查看解析"
          : "查看解析"
        : answered
        ? "已提交"
        : "提交答案";
    area.innerHTML =
      '<div class="q-meta"><span class="tag ' +
      q.type +
      '">' +
      TYPE_LABEL[q.type] +
      "</span>" +
      '<span class="tag">第 ' +
      (qIdx + 1) +
      " / " +
      qs.length +
      ' 题</span><span class="tag">原题号 ' +
      q.num +
      "</span>" +
      (q.stars ? '<span class="tag">' + q.stars + "</span>" : "") +
      "</div>" +
      '<div class="stem">' +
      mdLite(q.stem) +
      "</div>" +
      optsHtml +
      '<div class="actions"><button class="btn btn-primary" id="btnSubmit" type="button"' +
      (answered && q.type !== "calc" ? " disabled" : "") +
      ">" +
      submitLabel +
      "</button>" +
      (answered && q.type !== "calc"
        ? '<button class="btn btn-ghost" id="btnRetry" type="button">重做本题</button>'
        : "") +
      "</div>" +
      resultHtml +
      '<div class="nav-row"><button class="btn btn-ghost" id="btnPrev" type="button"' +
      (qIdx === 0 ? " disabled" : "") +
      ">上一题</button>" +
      '<button class="btn btn-ghost" id="btnNext" type="button"' +
      (qIdx >= qs.length - 1 ? " disabled" : "") +
      ">下一题</button></div>";

    if (!answered && q.type !== "calc") {
      var labels = area.getElementsByTagName("label");
      for (var li = 0; li < labels.length; li++) {
        (function (lab) {
          lab.addEventListener("click", function () {
            if (q.type === "single") {
              var all = area.getElementsByClassName("opt");
              for (var x = 0; x < all.length; x++)
                all[x].className = all[x].className.replace(/\s*selected/g, "");
              if (lab.className.indexOf("selected") < 0) lab.className += " selected";
            } else {
              setTimeout(function () {
                var inp = lab.getElementsByTagName("input")[0];
                if (inp.checked) {
                  if (lab.className.indexOf("selected") < 0) lab.className += " selected";
                } else lab.className = lab.className.replace(/\s*selected/g, "");
              }, 0);
            }
          });
        })(labels[li]);
      }
    }
    document.getElementById("btnSubmit").onclick = function () {
      submitAnswer(q);
    };
    var retry = document.getElementById("btnRetry");
    if (retry)
      retry.onclick = function () {
        delete progress[q.id];
        saveP(progress);
        render();
      };
    document.getElementById("btnPrev").onclick = function () {
      qIdx--;
      render();
    };
    document.getElementById("btnNext").onclick = function () {
      qIdx++;
      render();
    };
  }

  function submitAnswer(q) {
    if (q.type === "calc") {
      progress[q.id] = { answered: true, correct: true, selected: [] };
      saveP(progress);
      render();
      return;
    }
    var area = document.getElementById("quizArea"),
      inputs = area.getElementsByTagName("input"),
      checked = [];
    for (var i = 0; i < inputs.length; i++)
      if (inputs[i].name === "ans" && inputs[i].checked) checked.push(inputs[i].value);
    if (!checked.length) {
      alert(q.type === "multi" ? "请至少选择一个选项" : "请选择一个答案");
      return;
    }
    progress[q.id] = {
      answered: true,
      correct: eq(checked, q.correct),
      selected: checked
    };
    saveP(progress);
    render();
  }

  function showSummary() {
    var area = document.getElementById("quizArea"),
      sum = document.getElementById("summaryArea");
    area.style.display = "none";
    sum.className = "card summary show";
    var totalOk = 0,
      totalBad = 0,
      totalAns = 0,
      totalAll = 0,
      html = "";
    for (var ci = 0; ci < CHAPTERS.length; ci++) {
      var c = CHAPTERS[ci],
        ok = 0,
        bad = 0,
        ans = 0,
        scorable = 0;
      for (var qi = 0; qi < c.questions.length; qi++) {
        var q = c.questions[qi];
        if (q.type === "calc") continue;
        scorable++;
        var p = progress[q.id];
        if (p && p.answered) {
          ans++;
          if (p.correct) ok++;
          else bad++;
        }
      }
      totalAll += scorable;
      totalOk += ok;
      totalBad += bad;
      totalAns += ans;
      var rate = ans ? Math.round((ok / ans) * 100) : 0;
      html +=
        '<p style="margin:8px 0"><strong>' +
        c.title +
        "</strong>：已答 " +
        ans +
        "/" +
        scorable +
        "，正确 " +
        ok +
        "，正确率 " +
        rate +
        "%</p>";
    }
    var rateAll = totalAns ? Math.round((totalOk / totalAns) * 100) : 0;
    sum.innerHTML =
      '<div class="score-big">' +
      rateAll +
      "%</div>" +
      '<p style="margin-bottom:16px;color:#5a6a7a">已答 ' +
      totalAns +
      " / " +
      totalAll +
      " 道客观题 · 正确 " +
      totalOk +
      " · 错误 " +
      totalBad +
      "</p>" +
      html +
      '<div class="actions"><button class="btn btn-primary" id="btnBackQuiz" type="button">返回答题</button>' +
      '<button class="btn btn-ghost" id="btnClearAll" type="button">清空全部进度</button></div>';
    document.getElementById("btnBackQuiz").onclick = function () {
      sum.className = "card summary";
      area.style.display = "block";
      render();
    };
    document.getElementById("btnClearAll").onclick = function () {
      if (confirm("确定清空全部答题进度？")) {
        progress = {};
        saveP(progress);
        showSummary();
        updateStats();
      }
    };
  }

  function fetchText(url) {
    return fetch(url, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error(url + " → HTTP " + res.status);
      return res.text();
    });
  }

  function loadQuiz(force) {
    clearErr();
    document.getElementById("mainUi").classList.remove("ui-hidden");
    document.getElementById("quizArea").innerHTML =
      '<div class="empty">正在从 questions.md 加载…</div>';

    var i = 0;
    function tryNext() {
      if (i >= MD_URLS.length) {
        showErr(
          "无法加载 questions.md。请确认仓库根目录存在该文件，且通过网页（非本地双击 file://）打开。"
        );
        document.getElementById("quizArea").innerHTML =
          '<div class="empty">加载失败</div>';
        return;
      }
      var url = MD_URLS[i++] + (force ? "?t=" + Date.now() : "");
      fetchText(url)
        .then(function (text) {
          CHAPTERS = parseMarkdown(text);
          var total = CHAPTERS.reduce(function (s, c) {
            return s + c.questions.length;
          }, 0);
          if (!CHAPTERS.length || !total)
            throw new Error("MD 已读取，但未解析出题目，请检查格式");
          chapIdx = 0;
          qIdx = 0;
          bindUi();
          render();
          document.querySelector(".sub").textContent =
            "已从 questions.md 加载 " +
            CHAPTERS.length +
            " 章 / " +
            total +
            " 题 · 修改 MD 后点「重新加载 MD」或刷新页面";
        })
        .catch(function (e) {
          console.warn(e);
          tryNext();
        });
    }
    tryNext();
  }

  loadQuiz(false);
})();
</script>
</body>
</html>
